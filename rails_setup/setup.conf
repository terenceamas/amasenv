# ==============================================================================
# Rails Server Setup Configuration
# Edit this file before running install.sh.
# ==============================================================================

# Application
APP_NAME="myapp"
APP_USER="${USER}"
APP_ROOT="${HOME}/${APP_NAME}"
APP_CURRENT="${APP_ROOT}/current"
SERVER_NAME="_"
PUMA_PORT="3000"

# Ruby / Rails
RUBY_VERSION="3.3.6"
RAILS_VERSION="7.2.2"

# Optional components
INSTALL_MYSQL="yes"
INSTALL_PHP="yes"

# Ubuntu mirror
USE_NCHC_MIRROR="no"

# nginx.org package version.
# Leave blank to install the repository candidate.
NGINX_VERSION=""
