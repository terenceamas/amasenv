# ==============================================================================
# Rails Server Setup Configuration
# Edit this file before running install.sh.
# ==============================================================================

# Application
APP_NAME="myapp"
APP_USER="${USER}"
APP_ROOT="${HOME}/${APP_NAME}"
APP_CURRENT="${APP_ROOT}/current"
SERVER_NAME="app.example.com"
PUMA_PORT="3000"

# Set to "no" for initial HTTP-only setup or certificate provisioning.
ENABLE_SSL="yes"
SSL_CERTIFICATE="/etc/nginx/ssl/myapp.fullchain.pem"
SSL_CERTIFICATE_KEY="/etc/nginx/ssl/myapp.key"

# Nginx-to-Puma timeouts
PROXY_CONNECT_TIMEOUT="10s"
PROXY_SEND_TIMEOUT="120s"
PROXY_READ_TIMEOUT="120s"

# Ruby / Rails
RUBY_VERSION="3.3.6"
RAILS_VERSION="7.2.2"

# Per-user Node.js version manager
NVM_VERSION="v0.40.4"

# Optional components
INSTALL_MYSQL="yes"
INSTALL_PHP="yes"

# Ubuntu mirror
USE_NCHC_MIRROR="no"

# nginx.org package version.
# Leave blank to install the repository candidate.
NGINX_VERSION=""
